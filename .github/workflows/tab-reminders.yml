name: TAB daily reminders

on:
  schedule:
    # רץ כל שעה. תזכורת יומית נשלחת לכל משתמש בשעה שבחר (ברירת מחדל 08:00 שעון ישראל),
    # ובנוסף בכל הרצה נשלחות התראות "מישהו סימן ששילם" על חובות משותפים.
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          export VAPID_PUBLIC="$(printf %s "$VAPID_PUBLIC" | tr -d '[:space:]')"
          export VAPID_PRIVATE="$(printf %s "$VAPID_PRIVATE" | tr -d '[:space:]')"
          export VAPID_SUBJECT="$(printf %s "$VAPID_SUBJECT" | tr -d '[:space:]')"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund firebase-admin@^12 web-push@^3
          echo '' | base64 -d > send.js
          node send.js
