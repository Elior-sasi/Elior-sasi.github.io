name: TAB daily reminders

on:
  schedule:
    # 05:00 UTC ≈ 08:00 שעון ישראל בקיץ / 07:00 בחורף. לשינוי — שנה את השעה (UTC).
    - cron: '0 5 * * *'
  workflow_dispatch: {}   # גם הרצה ידנית מלשונית Actions (לבדיקה)

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund firebase-admin@^12 web-push@^3
          echo '' | base64 -d > send.js
          node send.js
