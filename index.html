<body>
<title>TAB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap');

  :root{
    --bg:#0c0f16;
    --surface:#141a26;
    --surface-2:#1a2231;
    --surface-3:#222c3e;
    --line:rgba(255,255,255,.07);
    --line-strong:rgba(255,255,255,.13);
    --text:#eaeef6;
    --muted:#94a0b4;
    --faint:#5f6a7e;
    --gold:#e6c583;
    --gold-deep:#c9a24a;
    --gold-dim:rgba(230,197,131,.13);
    --green:#43d69b;
    --green-dim:rgba(67,214,155,.14);
    --amber:#efb15c;
    --amber-dim:rgba(239,177,92,.15);
    --red:#f2726b;
    --red-dim:rgba(242,114,107,.14);
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
    --r:20px;
    --r-sm:13px;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  .vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  html,body{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0;height:0;display:none}
  body{touch-action:manipulation}
  body{
    direction:rtl;
    background:
      radial-gradient(920px 620px at 88% -8%, rgba(230,197,131,.13), transparent 56%),
      radial-gradient(760px 560px at -12% 8%, rgba(90,143,214,.09), transparent 55%),
      linear-gradient(168deg,#0a0d14,var(--bg) 72%);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-variant-numeric:tabular-nums;
  }
  .app{max-width:560px;margin:0 auto;padding:0 16px 130px;position:relative}

  /* ---------- Header ---------- */
  header{padding:26px 2px 14px;display:flex;align-items:center;justify-content:space-between}
  .prof-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-3);color:#0c0f16;font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;padding:0}
  .prof-btn.hasphoto{color:transparent}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .lmark{flex:0 0 auto;filter:drop-shadow(0 3px 8px rgba(230,197,131,.2))}
  .brand-text{display:flex;flex-direction:column;gap:2px}
  .brand .mark{
    font-family:'Sora',"Rubik",sans-serif;font-weight:800;font-size:27px;letter-spacing:3.5px;text-transform:uppercase;
    background:linear-gradient(160deg,#f3dca6,var(--gold) 45%,var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand .tag{font-size:12.5px;color:var(--faint);font-weight:500}
  .sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--faint);font-weight:500}
  .sync .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 0 rgba(67,214,155,.5)}
  .sync.on .dot{background:var(--green);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,214,155,.45)}70%{box-shadow:0 0 0 6px rgba(67,214,155,0)}100%{box-shadow:0 0 0 0 rgba(67,214,155,0)}}

  /* ---------- Hero summary ---------- */
  .hero{
    background:linear-gradient(158deg,var(--surface-2),var(--surface));
    border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:22px 22px 20px;
    box-shadow:0 20px 48px -26px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12);position:relative;overflow:hidden;
  }
  .hero::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1px;
    background:linear-gradient(160deg,rgba(230,197,131,.35),transparent 40%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .hero-top{display:flex;align-items:center;gap:20px}
  .ring-wrap{position:relative;flex:0 0 auto;width:104px;height:104px}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .ring-center .pct{font-size:23px;font-weight:800;font-family:'Sora',"Rubik",sans-serif;color:var(--gold);letter-spacing:-.5px}
  .ring-center .pct-l{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  .hero-figs{flex:1;min-width:0}
  .hero-figs .lbl{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .hero-figs .big{font-family:'Sora',"Rubik",sans-serif;font-weight:800;font-size:39px;line-height:1.05;margin:2px 0 12px;letter-spacing:-1px;white-space:nowrap}
  .hero-figs .big .cur{font-size:.62em;color:var(--muted);font-weight:700;margin-inline-end:2px}
  .mini{display:flex;gap:9px;margin-top:14px}
  .mini .m{flex:1;min-width:0;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px}
  .mini .m .mv{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .m.green .mv{color:var(--green)}
  .mini .m.red .mv{color:var(--red)}
  .mini .m .ml{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:1px}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:5px;margin:16px 0 4px;position:sticky;top:8px;z-index:20}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;
    font-size:13.5px;font-weight:600;padding:9px 4px;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:.18s}
  .tab .cnt{font-size:11px;background:var(--surface-3);color:var(--muted);border-radius:20px;padding:1px 7px;font-weight:700}
  .tab.active{background:linear-gradient(160deg,var(--surface-3),var(--surface-2));color:var(--text);box-shadow:0 3px 10px -5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
  .tab.active .cnt{background:var(--gold-dim);color:var(--gold)}
  .tab.alert.active .cnt,.tab.alert .cnt.hot{background:var(--red-dim);color:var(--red)}

  /* ---------- direction toggle ---------- */
  .mode-seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:5px;margin:14px 0 2px}
  .mseg{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13.5px;padding:10px 4px;border-radius:9px;cursor:pointer;transition:.15s}
  .mseg.on{background:linear-gradient(160deg,var(--surface-3),var(--surface-2));color:var(--text);box-shadow:0 3px 10px -5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}

  /* ---------- search + sort ---------- */
  .listctl{display:flex;gap:9px;margin:6px 0 12px;align-items:center}
  .listctl .srch{flex:1;padding:11px 13px;font-size:14px}
  .sortsel{flex:0 0 auto;background:var(--surface);border:1px solid var(--line-strong);color:var(--text);
    font-family:inherit;font-weight:600;font-size:13px;padding:11px 12px;border-radius:13px;outline:none;-webkit-appearance:none;cursor:pointer}

  /* ---------- Banner ---------- */
  .banner{display:flex;align-items:center;gap:12px;background:var(--gold-dim);
    border:1px solid rgba(230,197,131,.28);border-radius:var(--r-sm);padding:11px 13px;margin:14px 0 2px}
  .banner .bi{font-size:17px}
  .banner .bt{flex:1;font-size:12.5px;color:#f0dcae;line-height:1.4}
  .banner button{background:transparent;border:1px solid rgba(230,197,131,.4);color:var(--gold);
    font-family:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .banner button.bnx{border:none;color:#f0dcae;opacity:.55;font-size:15px;font-weight:400;padding:4px 4px;line-height:1}
  .banner button.bnx:active{opacity:1}

  /* ---------- Section ---------- */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 11px}
  .sec-head h2{font-family:"Rubik",sans-serif;font-weight:700;font-size:18px;margin:0}
  .sec-head .sub{font-size:12px;color:var(--faint);font-weight:500}

  /* ---------- Debt card ---------- */
  .card{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid rgba(255,255,255,.09);border-radius:var(--r);
    padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;
    box-shadow:0 10px 26px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
  .card:active{transform:scale(.988)}
  .card.paidfull{opacity:.72}
  #content{overflow-x:clip}
  .swipe-wrap{position:relative;margin-bottom:11px}
  .swipe-wrap>.card{margin-bottom:0!important;position:relative;z-index:1}
  .swipe-del{position:absolute;inset:0;border-radius:var(--r);background:linear-gradient(90deg,#e5484d,#c22b30);
    color:#fff;font-weight:800;font-size:16px;opacity:0;transition:opacity .12s;overflow:hidden}
  .swipe-del span{position:absolute;top:50%;left:24px;transform:translateY(-50%);white-space:nowrap;display:flex;align-items:center;gap:8px;direction:rtl}
  .swipe-wrap.sw-del .swipe-del{opacity:.6}
  .swipe-wrap.arm .swipe-del{opacity:1}
  .swipe-act{position:absolute;top:0;bottom:0;right:0;z-index:0;display:flex;border-radius:var(--r);overflow:hidden;opacity:0;transition:opacity .12s}
  .swipe-wrap.sw-act .swipe-act,.swipe-wrap.open-left .swipe-act{opacity:1}
  .swact{border:0;height:100%;padding:0 18px;font-family:inherit;font-weight:800;font-size:14px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .swact.paid{background:#2b9d78}
  .swact.edit{background:#3f6ea8}
  .swact:active{filter:brightness(.92)}
  .gcard{background:var(--surface-2);border:1px solid rgba(255,255,255,.11);border-radius:var(--r);margin-bottom:12px;overflow:hidden;
    box-shadow:0 10px 26px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07)}
  .gcard.paidfull{opacity:.72}
  .gc-head{display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer}
  .gc-meta{flex:1;min-width:0}
  .gc-nm{font-weight:700;font-size:15px;color:var(--text)}
  .gc-no{font-size:12px;color:var(--muted);margin-top:2px}
  .gc-amt{text-align:left;flex:0 0 auto}
  .gc-amt .rem{font-weight:800;font-size:18px;font-family:'Sora','Rubik',sans-serif}
  .gc-amt .of{font-size:11px;color:var(--faint)}
  .gc-chev{font-size:15px;color:var(--muted);transition:transform .2s;flex:0 0 auto}
  .gc-chev.open{transform:rotate(180deg)}
  .gc-prog{height:4px;background:rgba(255,255,255,.06)}
  .gc-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
  .gc-body{padding:11px 11px 1px;background:rgba(0,0,0,.16)}
  .gc-body .card{margin-bottom:10px}
  .gc-av{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#0c0f16;background-size:cover;background-position:center}
  /* itemized member rows */
  .card.itemcard{padding:11px 12px}
  .item-line{display:flex;align-items:center;gap:12px}
  .item-check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;color:#0c0f16;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;padding:0}
  .item-check.on{background:var(--green);border-color:var(--green)}
  .item-check:active{transform:scale(.9)}
  .item-main{flex:1;min-width:0}
  .item-main .nm{font-weight:700;font-size:14.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-main .no{font-size:11.5px;color:var(--faint);margin-top:1px}
  .item-amt{font-weight:800;font-size:16px;font-family:'Sora','Rubik',sans-serif;flex:0 0 auto}
  .item-amt.paid{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
  .gcard.gitems.paidfull .item-amt{color:var(--faint)}
  .ibrk{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
  .ibrk-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .ibrk-row:last-child{border-bottom:0}
  .ibrk-d{color:var(--text);font-size:14px;font-weight:600}
  .ibrk-a{color:var(--muted);font-size:14px;font-weight:700;font-family:'Sora','Rubik',sans-serif}
  .shared-chip{background:rgba(90,143,214,.18);color:#8fb8ef;font-size:11px;padding:1px 7px}
  /* public read-only view */
  #pubView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
  .pub-card{width:100%;max-width:440px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 24px 60px -28px rgba(0,0,0,.8)}
  .pub-logo{font-family:'Sora','Rubik',sans-serif;font-weight:800;font-size:26px;letter-spacing:2px;background:linear-gradient(160deg,#f6e2ad,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
  .pub-from{font-size:13px;color:var(--muted);font-weight:600}
  .pub-title{font-size:17px;font-weight:700;color:var(--text);margin-top:6px}
  .pub-amt{font-family:'Sora','Rubik',sans-serif;font-weight:800;font-size:44px;color:var(--gold);margin:12px 0 2px}
  .pub-sub{font-size:13px;color:var(--muted)}
  .pub-conf{margin-top:12px;font-weight:700;font-size:13px}
  .pub-conf.green{color:var(--green)} .pub-conf.red{color:var(--red)}
  .pub-list{margin-top:18px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
  .pub-sec{font-size:12px;color:var(--faint);font-weight:700;margin:8px 0 2px}
  .pub-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text)}
  .pub-row:last-child{border-bottom:0}
  .pub-note{margin-top:18px;font-size:11.5px;color:var(--faint)}
  .pub-open{display:inline-block;margin-top:14px;color:var(--gold);font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--gold-deep);border-radius:12px;padding:10px 18px}
  .pub-load,.pub-err{color:var(--muted);font-size:15px;padding:20px}
  .pub-err{color:var(--text)}
  .card .stripe{position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--faint)}
  .card.s-red .stripe{background:var(--red)}
  .card.s-amber .stripe{background:var(--amber)}
  .card.s-green .stripe{background:var(--green)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .who{display:flex;align-items:center;gap:11px;min-width:0}
  .avatar{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;color:#0c0f16;font-family:"Rubik",sans-serif}
  .who .nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .no{font-size:12px;color:var(--faint);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .amt-col{text-align:start;flex:0 0 auto}
  .amt-col .rem{font-weight:800;font-size:17px}
  .amt-col .of{font-size:11.5px;color:var(--faint);font-weight:500;margin-top:1px}
  .prog{height:7px;background:rgba(255,255,255,.06);border-radius:20px;overflow:hidden;margin-bottom:11px}
  .prog i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .5s cubic-bezier(.3,1,.5,1)}
  .card.paidfull .prog i{background:linear-gradient(90deg,#2fa878,var(--green))}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pips{display:flex;gap:5px;align-items:center}
  .pip{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.11)}
  .pip.done{background:var(--green)}
  .pip.over{background:var(--red)}
  .pip.soon{background:var(--amber)}
  .pip.today{background:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
  .pips .more{font-size:11px;color:var(--faint);font-weight:600;margin-inline-start:2px}
  .chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .chip.green{background:var(--green-dim);color:var(--green)}
  .chip.amber{background:var(--amber-dim);color:var(--amber)}
  .chip.red{background:var(--red-dim);color:var(--red)}
  .chip.today{background:var(--gold);color:#0c0f16;font-weight:800;animation:todayPulse 1.8s ease-in-out infinite}
  @keyframes todayPulse{0%,100%{box-shadow:0 0 0 0 var(--gold-dim)}50%{box-shadow:0 0 0 5px transparent}}
  .chip.neutral{background:rgba(255,255,255,.05);color:var(--muted)}
  .chip.offbtn{border:1px solid var(--gold-deep);background:var(--gold-dim);color:var(--gold);cursor:pointer;font-family:inherit;font-weight:700}
  .chip.offbtn:active{transform:scale(.94)}
  .cbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .cbadge.green{background:var(--green-dim);color:var(--green)}
  .cbadge.amber{background:var(--amber-dim);color:var(--amber)}
  .cbadge.red{background:var(--red-dim);color:var(--red)}
  .conf-seg{display:flex;gap:7px;margin-bottom:10px}
  .cfbtn{flex:1;border:1px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .cfbtn.on.c-pending{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
  .cfbtn.on.c-confirmed{border-color:var(--green);color:var(--green);background:var(--green-dim)}
  .cfbtn.on.c-disputed{border-color:var(--red);color:var(--red);background:var(--red-dim)}

  /* ---------- Empty ---------- */
  .empty{text-align:center;padding:46px 20px;color:var(--faint)}
  .empty .ic{font-size:40px;opacity:.7;margin-bottom:8px}
  .empty h3{color:var(--text);font-family:"Rubik",sans-serif;font-weight:700;margin:0 0 6px;font-size:19px}
  .empty p{font-size:13.5px;line-height:1.5;margin:0 auto;max-width:270px}

  /* ---------- Reminder rows ---------- */
  .rgroup{margin-bottom:18px}
  .rgroup .gh{display:flex;align-items:center;gap:8px;margin:0 4px 9px;font-size:13px;font-weight:700}
  .rgroup .gh .gc{font-size:11px;background:var(--surface-3);border-radius:20px;padding:1px 8px;color:var(--muted);font-weight:700}
  .rgroup.over .gh{color:var(--red)} .rgroup.over .gc{background:var(--red-dim);color:var(--red)}
  .rgroup.week .gh{color:var(--amber)} .rgroup.week .gc{background:var(--amber-dim);color:var(--amber)}
  .rgroup.later .gh{color:var(--muted)}
  .rrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:11px 13px;margin-bottom:8px}
  .rrow .rav{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0c0f16;font-family:"Rubik",sans-serif}
  .rrow .rmeta{flex:1;min-width:0}
  .rrow .rn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .rd{font-size:11.5px;color:var(--faint);font-weight:500;margin-top:1px}
  .rrow .ra{font-weight:800;font-size:15px;flex:0 0 auto}
  .rrow .rpay{flex:0 0 auto;border:0;background:var(--green-dim);color:var(--green);
    width:38px;height:38px;border-radius:11px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .rrow .rpay:active{transform:scale(.9)}

  /* ---------- FAB ---------- */
  .fab{position:fixed;bottom:24px;inset-inline-start:calc(50% - 280px + 20px);z-index:40;
    height:56px;padding:0 22px 0 20px;border:0;border-radius:18px;cursor:pointer;
    background:linear-gradient(160deg,#f3dca6,var(--gold) 55%,var(--gold-deep));color:#0c0f16;
    font-family:inherit;font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:8px;
    box-shadow:0 16px 40px -12px rgba(230,197,131,.5),0 6px 16px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5)}
  .fab:active{transform:translateY(1px)}
  .fab .plus{font-size:22px;line-height:1;margin-top:-2px}
  @media(max-width:592px){.fab{inset-inline-start:20px}}

  /* ---------- Sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,6,10,.66);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;inset-inline:0;bottom:0;z-index:60;max-width:560px;margin:0 auto;
    background:linear-gradient(180deg,rgba(24,31,45,.82),rgba(15,20,30,.86));
    -webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);
    border:1px solid rgba(255,255,255,.13);border-bottom:0;
    border-radius:30px 30px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.14);
    transform:translateY(102%);transition:transform .32s cubic-bezier(.22,1,.3,1);
    max-height:92vh;display:flex;flex-direction:column}
  .sheet.show{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:20px;background:var(--line-strong);margin:10px auto 2px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:center;justify-content:flex-start;gap:11px;padding:8px 20px 12px;flex:0 0 auto}
  .sheet-head h2{font-family:"Rubik",sans-serif;font-weight:700;font-size:20px;margin:0}
  .sheet-back{border:0;background:var(--surface-3);color:var(--text);width:36px;height:36px;border-radius:12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.15s}
  .sheet-back:active{transform:scale(.92);background:var(--surface-2)}
  .sheet-body{overflow-y:auto;padding:4px 20px 28px}

  /* ---------- Form ---------- */
  .field{margin-bottom:15px}
  .field>label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 2px 7px}
  .inp{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:13px;
    padding:13px 14px;color:var(--text);font-family:inherit;font-size:15px;font-weight:500;outline:none;transition:.15s}
  .inp:focus{border-color:var(--gold-deep);box-shadow:0 0 0 3px var(--gold-dim)}
  .inp::placeholder{color:var(--faint)}
  select.selnum{font-weight:700;cursor:pointer}
  .srow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .srow .sr-name{flex:2;min-width:0}
  .srow .sr-amt{flex:1;min-width:0}
  .srow .sr-rm{flex:0 0 auto;width:40px;height:44px;border-radius:12px;border:1px solid var(--line-strong);background:transparent;color:var(--faint);font-size:16px;cursor:pointer}
  .split-sum{margin-top:12px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
  .split-sum.warn{color:var(--amber)}
  .row2{display:flex;gap:11px}.row2>*{flex:1}
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line-strong);border-radius:13px;padding:5px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13px;padding:9px 4px;border-radius:9px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--surface-3);color:var(--text)}
  .preview{background:var(--gold-dim);border:1px solid rgba(230,197,131,.25);border-radius:13px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.6;color:#efdcb0}
  .preview b{color:var(--gold);font-weight:700}
  .btn-primary{width:100%;border:0;border-radius:14px;padding:15px;cursor:pointer;
    background:linear-gradient(160deg,#f3dca6,var(--gold) 55%,var(--gold-deep));color:#0c0f16;
    font-family:inherit;font-weight:800;font-size:15.5px;margin-top:4px}
  .btn-primary:active{transform:translateY(1px)}
  .wa-btn{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-deep);font-weight:700}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:11px;background:#fff;color:#3c4043;border:1px solid #dadce0;font-weight:600}
  .gbtn:active{background:#f1f3f4}
  .gicon{display:inline-flex;line-height:0}
  .btn-primary:disabled{opacity:.45;filter:grayscale(.3)}
  .rec-shot{display:block;text-align:center;margin-top:12px;box-sizing:border-box}
  .rec-more{width:100%;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;padding:12px 4px;margin-top:4px}
  .rec-more:active{color:var(--gold)}
  .btn-ghost{width:100%;border:1px solid var(--line-strong);border-radius:14px;padding:13px;cursor:pointer;
    background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:14px;margin-top:9px}
  .btn-danger{background:var(--red-dim);color:var(--red);border-color:transparent}

  /* ---------- Detail ---------- */
  .d-hero{display:flex;align-items:center;gap:13px;margin-bottom:6px}
  .d-hero .dav{width:52px;height:52px;border-radius:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#0c0f16;font-family:"Rubik",sans-serif}
  .d-hero .dn{font-weight:700;font-size:19px}
  .d-hero .dnote{font-size:12.5px;color:var(--faint);margin-top:2px}
  .d-stats{display:flex;gap:10px;margin:16px 0 6px}
  .d-stats .ds{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px}
  .d-stats .ds .dv{font-size:18px;font-weight:800}
  .d-stats .ds.green .dv{color:var(--green)}
  .d-stats .ds .dl{font-size:11px;color:var(--faint);font-weight:600;margin-top:2px}
  .sched-h{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 10px}
  .inst{display:flex;align-items:center;gap:8px;padding:12px 12px;background:var(--bg);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;transition:.15s}
  .inst.paid{background:var(--green-dim);border-color:transparent}
  .check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line-strong);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:.15s;background:transparent}
  .inst.paid .check{background:var(--green);border-color:var(--green);color:#0c0f16}
  .inst .imeta{flex:1;min-width:0}
  .inst .in{font-weight:600;font-size:14px}
  .inst .id{font-size:11.5px;color:var(--faint);margin-top:1px;word-break:break-word}
  .inst.paid .id{color:var(--green)}
  .inst .ia{font-weight:800;font-size:15px;flex:0 0 auto}
  .inst.paid .ia{text-decoration:line-through;opacity:.65}
  .inst.overdue .id{color:var(--red)}
  .inst.istoday{border-color:var(--gold)}
  .inst.istoday .id{color:var(--gold);font-weight:700}
  .pdate{background:transparent;border:0;border-bottom:1px dashed currentColor;color:inherit;
    font-family:inherit;font-size:11.5px;font-weight:600;padding:0 0 1px;margin-inline-start:3px;color-scheme:dark;-webkit-appearance:none;min-width:88px}
  .pdate::-webkit-calendar-picker-indicator{filter:invert(.7);opacity:.6;cursor:pointer}

  /* ---------- record-payment button ---------- */
  .record-btn{width:100%;margin-top:14px;border:1px solid rgba(67,214,155,.32);
    background:linear-gradient(160deg,rgba(67,214,155,.14),rgba(67,214,155,.05));
    color:#8ff0c4;font-family:inherit;font-weight:600;font-size:13.5px;
    padding:12px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .record-btn:active{transform:scale(.99)}
  .record-btn .ri{font-size:16px}

  /* ---------- paste + candidates ---------- */
  .paste-area{width:100%;min-height:74px;resize:none;background:var(--bg);border:1px solid var(--line-strong);
    border-radius:13px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;line-height:1.5;outline:none}
  .paste-area:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
  .paste-row{display:flex;gap:9px;margin-top:9px}
  .paste-row .btn-ghost{margin-top:0;flex:1}
  .amt-box{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line-strong);
    border-radius:14px;padding:6px 14px;margin:16px 0 6px}
  .amt-box .cur{font-size:22px;color:var(--muted);font-weight:700}
  .amt-box input{flex:1;border:0;background:transparent;color:var(--text);font-family:'Sora',"Rubik",sans-serif;
    font-weight:800;font-size:29px;letter-spacing:-.5px;outline:none;width:100%;padding:6px 0}
  .amt-box input::placeholder{color:var(--faint);font-family:"Rubik",sans-serif;font-weight:700;font-size:22px}
  .cand-h{font-size:13px;font-weight:700;color:var(--muted);margin:16px 2px 10px}
  .cand{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--bg);border:1px solid var(--line);
    border-radius:13px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .cand:active{transform:scale(.99)}
  .cand.match{border-color:rgba(67,214,155,.4);background:var(--green-dim)}
  .cand .cav{width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#0c0f16;font-family:"Rubik",sans-serif}
  .cand .cm{flex:1;min-width:0}
  .cand .cn{font-weight:600;font-size:14px}
  .cand .cd{font-size:11.5px;color:var(--faint);margin-top:1px}
  .cand .ca{font-weight:800;font-size:15px;flex:0 0 auto}
  .cand .badge{font-size:10.5px;font-weight:700;color:var(--green);background:rgba(67,214,155,.18);border-radius:20px;padding:2px 8px;flex:0 0 auto}
  .cand .badge.name{color:var(--gold);background:var(--gold-dim);margin-inline-start:5px}
  .cand.auto{border-color:var(--gold-deep);background:var(--gold-dim);box-shadow:0 0 0 1px rgba(230,197,131,.25)}
  .cand.auto .badge{color:#0c0f16;background:linear-gradient(160deg,#f3dca6,var(--gold-deep))}
  .cand-h.gold{color:var(--gold)}
  .cand-empty{text-align:center;color:var(--faint);font-size:13px;padding:18px;line-height:1.5}
  .hint{font-size:12px;color:var(--faint);line-height:1.5;margin:2px 2px 0}

  /* ---------- toast ---------- */
  .toast{position:fixed;bottom:96px;inset-inline:0;margin:0 auto;max-width:340px;z-index:70;
    background:var(--surface-3);border:1px solid var(--line-strong);color:var(--text);
    padding:13px 18px;border-radius:14px;box-shadow:var(--shadow);text-align:center;font-size:14px;font-weight:600;
    opacity:0;transform:translateY(12px);transition:.28s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast .tk{color:var(--green);margin-inline-end:6px}
  .toast{display:flex;align-items:center;gap:10px;justify-content:center}
  .toast .tmsg{flex:0 1 auto}
  .toast .tundo{flex:0 0 auto;border:0;background:var(--gold-dim);color:var(--gold);font-family:inherit;font-weight:800;font-size:13px;padding:6px 12px;border-radius:9px;cursor:pointer;pointer-events:auto}

  /* ---------- header actions ---------- */
  .hactions{display:flex;align-items:center;gap:10px}
  .menu-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);
    width:34px;height:34px;border-radius:11px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .menu-btn:active{transform:scale(.94)}

  /* ---------- partial / edit / whatsapp in detail ---------- */
  .inst.partial{background:var(--amber-dim);border-color:transparent}
  .inst.partial .check{background:var(--amber);border-color:var(--amber);color:#0c0f16;font-weight:800}
  .inst.partial .id{color:var(--amber)}
  .partbtn{flex:0 0 auto;border:1px solid var(--line-strong);background:transparent;color:var(--muted);
    font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer}
  .partbtn:active{transform:scale(.95)}
  .editbtn{flex:0 0 auto;border:1px solid var(--line-strong);background:transparent;color:var(--gold);
    font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer;align-self:center}
  .rrow .rwa{flex:0 0 auto;border:0;background:rgba(67,214,155,.12);color:var(--green);
    width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .rrow .rwa:active{transform:scale(.9)}

  /* ---------- edit rows ---------- */
  .erow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .erow .inp{padding:11px 12px;font-size:14px}
  .erm{flex:0 0 auto;border:1px solid var(--line-strong);background:transparent;color:var(--red);
    width:40px;height:40px;border-radius:11px;font-size:14px;cursor:pointer}
  .erm:active{transform:scale(.92)}

  /* ---------- settings ---------- */
  .set-stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
  .set-stat .dv{font-family:'Sora',"Rubik",sans-serif;font-size:30px;font-weight:800;color:var(--gold)}
  .set-stat .dl{font-size:12px;color:var(--faint);font-weight:600;margin-top:2px}
  .pref{margin:0 2px 12px}
  .pref-l{font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 7px}
  .pseg button{font-size:12.5px}
  .cloudbox:empty{display:none}
  .cloudbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .cl-row{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:var(--text)}
  .cl-on{font-size:12.5px;font-weight:800;color:var(--green)}
  .cl-off{font-size:12.5px;font-weight:700;color:var(--faint)}
  .cloudbox .btn-primary,.cloudbox .btn-ghost{margin-top:2px}
  .btn-danger{width:100%;border:1px solid rgba(240,110,110,.4);background:rgba(240,110,110,.08);color:#f28a8a;
    font-family:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:14px;cursor:pointer;margin-bottom:10px;transition:.15s}
  .btn-danger:active{transform:scale(.98);background:rgba(240,110,110,.16)}

  /* ---------- avatars with photo ---------- */
  .hasphoto{background-size:cover!important;background-position:center!important;color:transparent!important}

  /* ---------- quick people pick ---------- */
  .qpick{margin-bottom:16px}
  .qp-h{font-size:12px;font-weight:600;color:var(--muted);margin:0 2px 9px}
  .qp-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .qp{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--bg);border-radius:14px;padding:8px 12px 8px 8px;
    cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);font-family:inherit;font-weight:600;font-size:13px;transition:.15s}
  .qp.on{border-color:var(--gold-deep);background:var(--gold-dim)}
  .qp-av{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12px;color:#0c0f16;background-size:cover;background-position:center}

  /* ---------- photo picker ---------- */
  .photo-pick{display:flex;align-items:center;gap:14px;margin-bottom:16px;cursor:pointer}
  .pp-av{width:58px;height:58px;border-radius:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:var(--surface-3);border:1px solid var(--line-strong);background-size:cover;background-position:center;color:var(--faint)}
  .pp-txt{font-size:14px;font-weight:600;color:var(--text);display:flex;flex-direction:column;gap:3px}
  .pp-txt span{font-size:11.5px;font-weight:500;color:var(--faint)}
  #ePhotoRm{color:var(--red)!important;cursor:pointer;text-decoration:underline}

  /* ---------- color swatches ---------- */
  .color-row{display:flex;gap:9px;flex-wrap:wrap}
  .cswatch{width:36px;height:36px;border-radius:12px;border:0;cursor:pointer;padding:0;transition:.12s;
    background:var(--surface-3);color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .cswatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
  .cswatch:active{transform:scale(.92)}

  /* ---------- photo cropper ---------- */
  .crop-ov{position:fixed;inset:0;z-index:300;background:rgba(4,6,10,.82);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .crop-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:22px;padding:20px;
    width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .crop-title{font-family:'Rubik',sans-serif;font-weight:700;font-size:16px;align-self:stretch;text-align:center;color:var(--text)}
  .crop-stage{position:relative;width:260px;height:260px;overflow:hidden;border-radius:26px;background:#000;
    touch-action:none;cursor:grab;box-shadow:0 0 0 1px var(--line-strong) inset}
  .crop-img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .crop-zoom{width:100%;accent-color:var(--gold)}
  .crop-actions{display:flex;gap:10px;width:100%}
  .crop-actions .btn-ghost,.crop-actions .btn-primary{margin-top:0;flex:1}

  /* ---------- receipt ---------- */
  .rcptbtn{flex:0 0 auto;border:1px solid var(--line-strong);background:transparent;color:var(--muted);
    width:31px;height:31px;border-radius:10px;font-size:14px;cursor:pointer;padding:0}
  .rcptbtn.has{border-color:rgba(67,214,155,.4);background:var(--green-dim)}
  .rcptbtn:active{transform:scale(.92)}
  .rcpt-ov{position:fixed;inset:0;z-index:300;background:rgba(4,6,10,.86);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .rcpt-inner{display:flex;flex-direction:column;gap:12px;max-width:420px;width:100%;align-items:center}
  .rcpt-inner img{max-width:100%;max-height:70vh;border-radius:14px;border:1px solid var(--line-strong)}
  .rcpt-actions{display:flex;gap:10px;width:100%}
  .rcpt-actions .btn-ghost{margin-top:0;flex:1}

  /* ---------- onboarding ---------- */
  .ob-ov{position:fixed;inset:0;z-index:250;background:
      radial-gradient(700px 460px at 50% 26%, rgba(230,197,131,.10), transparent 62%), var(--bg);
    display:flex;align-items:center;justify-content:center;padding:28px}
  .ob-card{max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
  .ob-ic{font-size:64px;filter:drop-shadow(0 8px 24px rgba(230,197,131,.3))}
  .ob-t{font-family:'Rubik',sans-serif;font-weight:800;font-size:26px;color:var(--text)}
  .ob-x{font-size:15.5px;line-height:1.6;color:var(--muted);max-width:300px}
  .ob-dots{display:flex;gap:8px;margin:6px 0 4px}
  .ob-dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
  .ob-dot.on{background:var(--gold);width:22px;border-radius:20px}
  .ob-card .btn-primary{max-width:280px}
  .ob-skip{border:0;background:transparent;color:var(--faint);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:4px}
  .cfm-ov{position:fixed;inset:0;z-index:260;background:rgba(4,6,10,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px}
  .cfm-card{background:linear-gradient(158deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);border-radius:22px;padding:22px 20px 18px;max-width:420px;width:100%;box-shadow:var(--shadow);animation:cfmUp .22s ease}
  @keyframes cfmUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  .cfm-ic{font-size:34px;text-align:center}
  .cfm-q{font-family:'Rubik',sans-serif;font-weight:700;font-size:18px;color:var(--text);text-align:center;line-height:1.45;margin:10px 4px 4px}
  .cfm-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:16px}
  .cfm-btns{display:flex;gap:10px}
  .cfm-btns button{flex:1;border-radius:14px;padding:14px 8px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--line-strong);background:transparent;color:var(--text)}
  .cfm-yes{border-color:var(--green)!important;background:var(--green)!important;color:#0c0f16!important}
  .cfm-part{display:block;width:100%;margin-top:10px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:14px;padding:12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .cfm-part:active{background:var(--surface-3)}
  .cfm-skip{display:block;margin:12px auto 0;border:0;background:transparent;color:var(--faint);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}
  .cfm-count{text-align:center;font-size:12px;color:var(--faint);margin-top:10px}

  /* ---------- trend bars ---------- */
  .trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding:6px 2px 0}
  .tbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .tbar-v{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;height:14px}
  .tbar-track{flex:1;width:100%;display:flex;align-items:flex-end;background:rgba(255,255,255,.03);border-radius:8px;overflow:hidden}
  .tbar-track i{display:block;width:100%;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.3,1,.5,1)}
  .tbar-l{font-size:11px;font-weight:600;color:var(--faint)}

  /* ---------- PIN pad ---------- */
  .pad-ov{position:fixed;inset:0;z-index:260;background:
      radial-gradient(700px 420px at 50% 30%, rgba(230,197,131,.08), transparent 62%), var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .pad-card{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:300px}
  .pad-logo{font-size:34px}
  .pad-title{font-family:'Rubik',sans-serif;font-weight:700;font-size:18px;color:var(--text);text-align:center}
  .pad-dots{display:flex;gap:16px}
  .pdot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-strong);transition:.15s}
  .pdot.on{background:var(--gold);border-color:var(--gold)}
  .pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;direction:ltr}
  .pad-key{width:66px;height:66px;margin:0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text);
    font-family:'Sora',"Rubik",sans-serif;font-weight:700;font-size:24px;border-radius:50%;cursor:pointer;transition:.12s;display:flex;align-items:center;justify-content:center}
  .pad-key:active{transform:scale(.92);background:var(--surface-3)}
  .pad-key.empty{background:transparent;border:0;cursor:default}
  .pad-cancel{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:6px 12px}
  .pad-card.shake{animation:padshake .4s}
  @keyframes padshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

  /* ---------- recurring toggle ---------- */
